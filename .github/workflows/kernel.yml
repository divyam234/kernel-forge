name: KernelForge

on:
  workflow_dispatch:
    inputs:
      device:
        description: Kernel device(s) to build
        required: true
        type: choice
        default: both
        options:
          - both
          - lemonades
          - capri

permissions:
  contents: read

# Manual dispatches are independent; never auto-cancel an explicitly requested build.
concurrency:
  group: kernel-forge-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate shared config and both devices
    runs-on: ubuntu-24.04
    outputs:
      devices: ${{ steps.select.outputs.devices }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Select requested devices
        id: select
        env:
          REQUESTED_DEVICE: ${{ inputs.device || 'both' }}
        run: |
          case "$REQUESTED_DEVICE" in
            both) echo 'devices=["lemonades","capri"]' >> "$GITHUB_OUTPUT" ;;
            lemonades) echo 'devices=["lemonades"]' >> "$GITHUB_OUTPUT" ;;
            capri) echo 'devices=["capri"]' >> "$GITHUB_OUTPUT" ;;
            *) echo "Unsupported device: $REQUESTED_DEVICE" >&2; exit 1 ;;
          esac
      - name: Validate configuration
        run: |
          for device in lemonades capri; do
            python -m kernelforge validate --device "$device"
          done
      - name: Preview build commands
        run: |
          for device in lemonades capri; do
            python -m kernelforge build --device "$device" --dry-run
          done

  build:
    name: Build ${{ matrix.device }} with shared DroidSpaces (LLVM + ccache)
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(needs.validate.outputs.devices) }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: 'true'
      # Maximum cache size is read from build.ccache.max_size in kernel.yaml.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build dependencies and ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex build-essential ccache \
            libssl-dev libelf-dev libncurses-dev \
            device-tree-compiler dwarves

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Resolve pinned LLVM identity
        id: llvm
        run: |
          echo "identity=$(python -c 'from kernelforge.cli import load_config; t=load_config()["toolchain"]; print(t.get("sha256") or t.get("commit") or t["ref"])')" >> "$GITHUB_OUTPUT"

      - name: Restore pinned LLVM toolchain
        uses: actions/cache@v6
        with:
          path: .work/_toolchains/kernel/llvm
          key: llvm-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.llvm.outputs.identity }}

      # Include a unique run ID because GitHub caches cannot be updated in place.
      # Restore the newest prior cache for the same config, then fall back to
      # the newest ccache for this OS/architecture. Compiler flags are hashed
      # by ccache, so obsolete outputs do not produce false cache hits.
      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.device }}-${{ hashFiles('kernel.yaml', 'devices/**', 'assets/**', 'patches/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.device }}-${{ hashFiles('kernel.yaml', 'devices/**', 'assets/**', 'patches/**') }}-
            ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.device }}-

      - name: Initialize cache statistics
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --zero-stats
          ccache --show-config | grep -E 'cache_dir|base_dir|compiler_check|max_size' || true

      - name: Compile selected kernel (DroidSpaces always enabled)
        id: compile
        run: python -m kernelforge build --device "${{ matrix.device }}" -j "$(nproc)" --no-package

      # Persist compiled objects BEFORE packaging. Also save partial results if
      # compilation fails; cancellation still cannot guarantee cache persistence.
      - name: Save ccache immediately after compilation
        if: ${{ always() && !cancelled() && steps.compile.outcome != 'skipped' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.device }}-${{ hashFiles('kernel.yaml', 'devices/**', 'assets/**', 'patches/**') }}-${{ github.run_id }}-${{ github.run_attempt }}

      # Save finished kernel outputs before packaging, so a broken AnyKernel3
      # step cannot lose the Image and generated Kconfig.
      - name: Stage compiled kernel outputs
        if: ${{ always() && !cancelled() && steps.compile.outcome == 'success' }}
        run: |
          device="${{ matrix.device }}"
          workspace="$(python -c 'import sys; from kernelforge.cli import workspace_name; print(workspace_name(sys.argv[1]))' "$device")"
          output=".work/$workspace/out"
          test -s "$output/arch/arm64/boot/Image"
          test -s "$output/.config"
          mkdir -p "dist/compiled/$device"
          cp "$output/arch/arm64/boot/Image" "dist/compiled/$device/Image"
          cp "$output/.config" "dist/compiled/$device/kernel.config"
          if test "$device" = capri; then
            # Preserve the exact modules and ABI inputs even if packaging fails.
            python -c 'import sys; from pathlib import Path; from kernelforge.modules import archive_modules; archive_modules(Path(sys.argv[1]), Path(sys.argv[2]))' \
              "$output" "dist/compiled/$device/modules.tar.gz"
          fi
          ls -lh "dist/compiled/$device/"

      - name: Upload compiled kernel before packaging
        if: ${{ always() && !cancelled() && steps.compile.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: compiled-${{ matrix.device }}-${{ github.run_number }}
          path: dist/compiled/${{ matrix.device }}/
          if-no-files-found: error
          retention-days: 14

      - name: Package compiled kernel
        id: package
        if: ${{ always() && !cancelled() && steps.compile.outcome == 'success' }}
        run: |
          device="${{ matrix.device }}"
          python -m kernelforge package --device "$device"
          workspace="$(python -c 'import sys; from kernelforge.cli import workspace_name; print(workspace_name(sys.argv[1]))' "$device")"
          mkdir -p "dist/packages/$device"
          cp ".work/$workspace/DroidSpaces-$device.zip" "dist/packages/$device/"
          ls -lh "dist/packages/$device/"

      - name: Report ccache performance
        if: always()
        run: |
          if command -v ccache >/dev/null; then
            ccache --show-stats
            {
              echo '### Ccache statistics'
              echo '```'
              ccache --show-stats
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload packaged AnyKernel3 ZIP
        if: ${{ always() && !cancelled() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: droidspaces-${{ matrix.device }}-${{ github.run_number }}
          path: dist/packages/${{ matrix.device }}/DroidSpaces-${{ matrix.device }}.zip
          if-no-files-found: error
          retention-days: 14
