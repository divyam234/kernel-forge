# Motorola moto g10 power (XT2127-4, LineageOS variant 2), codename capri.
# Source and config from official LineageOS capri + sm6225-common device trees.
source:
  url: https://github.com/LineageOS/android_kernel_motorola_sm6225.git
  ref: lineage-24.0
  # Always fetch the latest lineage-24.0 branch head.
build:
  defconfig: vendor/bengal-perf_defconfig
  fragments:
    - vendor/ext_config/moto-bengal.config
    - vendor/ext_config/capri-default.config
  # This kernel tree does not generate generic dtb/dtbo.img boot artifacts.
  # Retain installed DTB/DTBO; package the matching module set with Image.
  artifacts:
    - arch/arm64/boot/Image
    - modules.order
    - Module.symvers
    - include/config/kernel.release
package:
  type: manual-images
  output: DroidSpaces-capri-payload.zip
  device_check: true
  device:
    name: Motorola moto g10 power
    codenames: [capri]
    android_versions: ["17"]
  images:
    arch/arm64/boot/Image: Image
  modules:
    # Official LineageOS TARGET_MODULE_ALIASES; other filenames are unchanged.
    aliases:
      wlan.ko: qca_cld3_wlan.ko
      adsp_loader_dlkm.ko: audio_adsp_loader.ko
      apr_dlkm.ko: audio_apr.ko
      bolero_cdc_dlkm.ko: audio_bolero_cdc.ko
      machine_dlkm.ko: audio_machine_bengal.ko
      mbhc_dlkm.ko: audio_mbhc.ko
      native_dlkm.ko: audio_native.ko
      pinctrl_lpi_dlkm.ko: audio_pinctrl_lpi.ko
      platform_dlkm.ko: audio_platform.ko
      pm2250_spmi_dlkm.ko: audio_pm2250_spmi.ko
      q6_dlkm.ko: audio_q6.ko
      q6_notifier_dlkm.ko: audio_q6_notifier.ko
      q6_pdr_dlkm.ko: audio_q6_pdr.ko
      rouleur_dlkm.ko: audio_rouleur.ko
      rouleur_slave_dlkm.ko: audio_rouleur_slave.ko
      rx_macro_dlkm.ko: audio_rx_macro.ko
      snd_event_dlkm.ko: audio_snd_event.ko
      aw882xx_dlkm.ko: audio_snd_soc_aw882xx.ko
      stub_dlkm.ko: audio_stub.ko
      swr_dlkm.ko: audio_swr.ko
      swr_ctrl_dlkm.ko: audio_swr_ctrl.ko
      tx_macro_dlkm.ko: audio_tx_macro.ko
      usf_dlkm.ko: audio_usf.ko
      va_macro_dlkm.ko: audio_va_macro.ko
      wcd937x_dlkm.ko: audio_wcd937x.ko
      wcd937x_slave_dlkm.ko: audio_wcd937x_slave.ko
      wcd9xxx_dlkm.ko: audio_wcd9xxx.ko
      wcd_core_dlkm.ko: audio_wcd_core.ko
      wsa881x_analog_dlkm.ko: audio_wsa881x_analog.ko
    vendor_boot:
      - nova_0flash_mmi.ko
      - ili9882_mmi.ko
      - exfat.ko
