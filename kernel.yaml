apiVersion: kernelforge/v1

# One source of truth: edit this file for another kernel. No profiles.
source:
  url: https://github.com/LineageOS/android_kernel_oneplus_sm8250.git
  ref: lineage-24.0
  # Known LineageOS 24 snapshot. Update deliberately after reviewing patches.
  commit: 078365e5318de0a30a41f9707070b610bcd20f13

# One LLVM toolchain throughout: config, compile, link, and CI.
# Matches LineageOS SM8250's build.config.common: clang-r416183b + LLVM=1.
# The pinned prebuilt is for x86_64 Linux; use KERNELFORGE_LLVM_BIN on ARM64 hosts.
toolchain:
  url: https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git
  ref: lineage-20.0
  commit: 54220fd601050b350b2af7adc913089ebf0e7aed

build:
  arch: arm64
  defconfig: vendor/kona-perf_defconfig
  fragments:
    - vendor/oplus.config
  targets: []
  artifacts:
    - arch/arm64/boot/Image
    - arch/arm64/boot/dtb
    - arch/arm64/boot/dtbo.img
  strict_config: true
  # Cache Clang compilation locally and on GitHub Actions.
  ccache:
    enabled: true
    max_size: 2G

# Mandatory: always applied, and always merged as the final fragment.
droidspaces:
  config: assets/droidspaces.config
  destination: arch/arm64/configs/vendor/droidspaces.config
  target: vendor/droidspaces.config

# Optional additional file overlays for other kernel trees.
overlays: []

# Order is important. 0006 is ported to LineageOS 24's existing syscalls.
# 0001, 0002, 0007-0009 are already present in this kernel; 0010 is x86.
patches:
  - file: patches/backports-4.19/0003-statx-add-mount-ID.patch
    enabled: true
  - file: patches/backports-4.19/0004-statx-add-mount_root.patch
    enabled: true
  - file: patches/backports-4.19/0005-utimensat-AT_EMPTY_PATH-support.patch
    enabled: true
  - file: patches/backports-4.19/0006-faccessat2-lineage24.patch
    enabled: true
  - file: patches/0001-lxc-cgroup-prefix.patch
    enabled: true

# AnyKernel3 ZIP is required for every build. Change this block for another device.
# Kernel source, defconfig, patches and image outputs must ALSO match that device.
package:
  type: anykernel3
  output: DroidSpaces-lemonades.zip
  device:
    name: OnePlus 9R
    codenames: [lemonades]       # ro.product.device / ro.build.product
    android_versions: ["17"]   # supported.versions in AnyKernel3
  anykernel:
    url: https://github.com/osm0sis/AnyKernel3.git
    ref: master
    commit: dca9dc370838d919d56c1f59ec78b27a14a72c68
  boot:
    partition: boot             # by-name block partition
    slots: auto                 # auto, ab or single
    ramdisk: auto
    vbmeta: auto
    install: write_boot        # write_boot or flash_boot
  images:                      # paths relative to .work/kernel/out
    arch/arm64/boot/Image: Image
    arch/arm64/boot/dtb: dtb
    arch/arm64/boot/dtbo.img: dtbo.img
