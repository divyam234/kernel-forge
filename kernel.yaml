apiVersion: kernelforge/v1

# Shared settings for all devices. Device-specific source, defconfig and ZIP metadata
# live in devices/<codename>.yaml. No build profiles.
toolchain:
  url: https://github.com/greenforce-project/greenforce_clang/releases/download/20261107/gf-clang-24.0.0-20261107.tar.gz
  ref: "20261107"
  sha256: c0786cefe7db077db22dd4999842c1a57d15da45d7c78dd6d53189078a52b67f

# Built-in root for both devices; manual hooks support the 4.19 kernels.
root:
  enabled: true
  url: https://github.com/Baka-SU/BakaSU.git
  ref: main
  commit: 548d1dda060ca198823d8808804d01f5209ef4a9

build:
  arch: arm64
  targets: []
  artifacts:
    - arch/arm64/boot/Image
  ccache:
    enabled: true
    max_size: 2G

# Mandatory common DroidSpaces fragment: applied to every device.
droidspaces:
  config: assets/droidspaces.config
  destination: arch/arm64/configs/vendor/droidspaces.config
  target: vendor/droidspaces.config

overlays: []

# Shared 4.19 patches. The four systemd 258-262 backports are required: probing
# both LineageOS 24.0 trees reports the mount-ID, mount-root, AT_EMPTY_PATH and
# faccessat2 features as missing. Keep patch order; 0004 builds on 0003.
patches:
  - file: patches/backports-4.19/0003-statx-add-mount-ID.patch
    enabled: true
  - file: patches/backports-4.19/0004-statx-add-mount_root.patch
    enabled: true
  - file: patches/backports-4.19/0005-utimensat-AT_EMPTY_PATH-support.patch
    enabled: true
  - file: patches/backports-4.19/0006-faccessat2-lineage24.patch
    enabled: true
  - file: patches/0001-lxc-cgroup-prefix.patch
    enabled: true

# Common AnyKernel3 installer policy; device metadata and images are in devices/.
package:
  type: anykernel3
  device_check: false
  anykernel:
    url: https://github.com/osm0sis/AnyKernel3.git
    ref: master
    commit: dca9dc370838d919d56c1f59ec78b27a14a72c68
  boot:
    partition: boot
    slots: auto
    ramdisk: auto
    vbmeta: auto
    install: write_boot
