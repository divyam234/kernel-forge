apiVersion: kernelforge/v1

# Shared settings for all devices. Device-specific source, defconfig and ZIP metadata
# live in devices/<codename>.yaml. No build profiles.
toolchain:
  url: https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git
  ref: lineage-20.0
  commit: 54220fd601050b350b2af7adc913089ebf0e7aed

build:
  arch: arm64
  targets: []
  artifacts:
    - arch/arm64/boot/Image
  ccache:
    enabled: true
    max_size: 2G

# Mandatory common DroidSpaces fragment: applied to every device.
droidspaces:
  config: assets/droidspaces.config
  destination: arch/arm64/configs/vendor/droidspaces.config
  target: vendor/droidspaces.config

overlays: []

# Shared 4.19 cgroup patch. Modern-systemd backports stay optional and off.
# Reassess compatibility with the selected kernel before enabling the backports.
patches:
  - file: patches/backports-4.19/0003-statx-add-mount-ID.patch
    enabled: false
  - file: patches/backports-4.19/0004-statx-add-mount_root.patch
    enabled: false
  - file: patches/backports-4.19/0005-utimensat-AT_EMPTY_PATH-support.patch
    enabled: false
  - file: patches/backports-4.19/0006-faccessat2-lineage24.patch
    enabled: false
  - file: patches/0001-lxc-cgroup-prefix.patch
    enabled: true

# Common AnyKernel3 installer policy; device metadata and images are in devices/.
package:
  type: anykernel3
  device_check: false
  anykernel:
    url: https://github.com/osm0sis/AnyKernel3.git
    ref: master
    commit: dca9dc370838d919d56c1f59ec78b27a14a72c68
  boot:
    partition: boot
    slots: auto
    ramdisk: auto
    vbmeta: auto
    install: write_boot
